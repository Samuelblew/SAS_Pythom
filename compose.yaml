name: ias-local

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ias_dev
      MYSQL_USER: ias
      MYSQL_PASSWORD: ias-local-dev
      MYSQL_ROOT_PASSWORD: ias-root-local-dev
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ias_dev
      MYSQL_USER: ias
      MYSQL_PASSWORD: ias-local-dev
      MYSQL_SSL: "false"
      ENVIRONMENT: Development
      JWT_SECRET: ias-docker-local-dev-secret-at-least-32-characters
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "127.0.0.1:${IAS_API_PORT:-5203}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Frontend/Dockerfile
    ports:
      - "127.0.0.1:${IAS_WEB_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
